version: '3.8'

services:
  web:
    build: .
    container_name: mon-jeu-web
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: mon-jeu-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: p@ssw0rd
      MYSQL_DATABASE: magaremestrains
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - 8081:80
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: p@ssw0rd

volumes:
  db_data:
