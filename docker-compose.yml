version: '3.8'

services:
  web:
    build: .
    container_name: mon-jeu-web
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: mon-jeu-db
    restart: always
    command: >
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: p@ssw0rd
      MYSQL_DATABASE: magaremestrains
    volumes:
      - ./db_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro